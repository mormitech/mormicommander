name: build

# Every push builds and tests on the three systems. Pushing a tag like v0.5.0 also attaches the packages to a GitHub
# release: a zipped .app (macOS arm64), an Inno Setup installer and a zip (Windows x64), a tar.gz and a .deb (Linux x64).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mormicommander-macos
          - os: ubuntu-latest
            artifact: mormicommander-linux
          - os: windows-latest
            artifact: mormicommander-windows
    runs-on: ${{ matrix.os }}
    # Whether the signing secrets are there (a step's own if can't look at secrets directly).
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # Go is pinned to the version go.mod names, so every run (and every system) builds with the same compiler.
      # setup-go keeps the module and build caches between runs, keyed on go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # npm's download cache is kept between runs, keyed on the lock file.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Windows only: Wails' wails3 tool (for the .exe's icon and file properties) is built once and cached, instead of
      # `go run …wails3@v3.1.0` compiling it on every run; build.sh uses it through WAILS3. The version is the same
      # one as in build.sh and go.mod.
      - name: Cache the wails3 tool (Windows)
        if: runner.os == 'Windows'
        id: wails3-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wails3-bin
          key: wails3-v3.1.0-${{ runner.os }}-${{ runner.arch }}
      - name: Build the wails3 tool (Windows)
        if: runner.os == 'Windows' && steps.wails3-cache.outputs.cache-hit != 'true'
        shell: bash
        run: GOBIN="$(cygpath -m "$RUNNER_TEMP")/wails3-bin" go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
      - name: Use the cached wails3 tool (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "WAILS3=$(cygpath -m "$RUNNER_TEMP")/wails3-bin/wails3.exe" >> "$GITHUB_ENV"
      # Wails v3 on Linux is GTK 4 with WebKitGTK 6.0.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # The Go code embeds the built frontend, so it has to exist before `go vet` and `go test`.
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      # Every tracked Go file has to be gofmt-formatted. Checked on Linux only: a Windows checkout can turn line
      # endings into CRLF, which gofmt would report even though the files in the repository are fine.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "these files need gofmt -w:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      # scripts/build.sh is the whole build (no Wails CLI): the .app on macOS, the .exe with its icon and file
      # properties on Windows, the binary on Linux. The frontend was built above.
      # macOS signing (board issue #44): with the Developer ID certificate in the repository secrets, it goes into a
      # keychain of this run only and build.sh signs with it (hardened runtime); without the secrets the app is
      # signed ad hoc as before. MACOS_CERT_P12 is the .p12 export in base64, MACOS_CERT_PASSWORD its password.
      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db" kp=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$id" ] || { echo "no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      # On macOS the app is universal: Apple silicon and Intel in one binary.
      - run: |
          if [ "$RUNNER_OS" = macOS ]; then export GOARCH=universal; fi
          bash scripts/build.sh --skip-frontend
        shell: bash
      # Notarization (board issue #44), only for a Developer ID signed app and with the App Store Connect API key in
      # the secrets: APPLE_API_KEY_ID, APPLE_API_ISSUER and APPLE_API_KEY_P8 (the .p8 file's text).
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != '' && env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY_P8="$RUNNER_TEMP/AuthKey.p8" bash scripts/notarize.sh build/bin/mormicommander.app
          rm "$RUNNER_TEMP/AuthKey.p8"
      - name: Version
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./wails.json').info.productVersion")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # a release tag has to match the version in wails.json
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "tag $GITHUB_REF_NAME does not match wails.json version $v"; exit 1
          fi
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          # build.sh put the `mormicommander` command in the app (packaging/macos) and signed it: with the Developer
          # ID (then notarized above) when the secrets are there, ad hoc otherwise. Universal: both kinds of Mac.
          codesign --verify --deep build/bin/mormicommander.app
          lipo -archs build/bin/mormicommander.app/Contents/MacOS/mormicommander | grep -q 'x86_64 arm64\|arm64 x86_64'
          ditto -c -k --keepParent build/bin/mormicommander.app "dist/mormicommander-${{ steps.version.outputs.version }}-macos-universal.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp packaging/linux/mormicommander.desktop packaging/linux/install.sh build/appicon.png build/bin/
          tar -czf "dist/mormicommander-${{ steps.version.outputs.version }}-linux-x64.tar.gz" -C build/bin mormicommander mormicommander.desktop install.sh appicon.png -C "$PWD" LICENSE
      # A .deb for Debian and Ubuntu: `sudo apt install ./mormicommander_<version>_amd64.deb` installs GTK 4 and
      # WebKitGTK 6.0 from the distribution along with it. dpkg-shlibdeps reads the binary and names the packages it
      # needs; the check after it makes sure those are the GTK 4 / WebKitGTK 6.0 runtime libraries.
      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          v='${{ steps.version.outputs.version }}'
          pkg="$RUNNER_TEMP/deb"
          install -Dm755 build/bin/mormicommander "$pkg/usr/bin/mormicommander"
          install -Dm644 LICENSE "$pkg/usr/share/doc/mormicommander/copyright"
          install -Dm644 packaging/linux/mormicommander.desktop "$pkg/usr/share/applications/mormicommander.desktop"
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          for s in 64 128 256 512; do
            mkdir -p "$pkg/usr/share/icons/hicolor/${s}x${s}/apps"
            convert build/appicon.png -resize ${s}x${s} "$pkg/usr/share/icons/hicolor/${s}x${s}/apps/mormicommander.png"
          done
          # dpkg-shlibdeps wants a debian/control to sit next to it
          work="$RUNNER_TEMP/shlibs" && mkdir -p "$work/debian" && printf 'Source: mormicommander\n\nPackage: mormicommander\nArchitecture: amd64\n' > "$work/debian/control"
          deps=$(cd "$work" && dpkg-shlibdeps -O "$pkg/usr/bin/mormicommander" | sed 's/^shlibs:Depends=//')
          echo "Depends: $deps"
          for need in libgtk-4-1 libwebkitgtk-6.0-4; do
            case ", $deps" in *", $need"*) ;; *) echo "Depends lacks $need"; exit 1 ;; esac
          done
          mkdir -p "$pkg/DEBIAN"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: mormicommander
          Version: $v
          Architecture: amd64
          Maintainer: Mormitech <accounts@mormitech.com>
          Depends: $deps
          Section: utils
          Priority: optional
          Homepage: https://github.com/mormitech/mormicommander
          Installed-Size: $(du -sk "$pkg/usr" | cut -f1)
          Description: Two-panel file manager
           mormiCommander is a two-panel file manager in the spirit of Total Commander: copy, move, rename and
           delete files between two folders side by side, with Total Commander's keys.
          EOF
          dpkg-deb --build --root-owner-group "$pkg" "dist/mormicommander_${v}_amd64.deb"
          dpkg-deb --info "dist/mormicommander_${v}_amd64.deb"
      # Windows signing (board issue #45), for release tags only and only with the SignPath secrets (docs/signing.md):
      # the .exe goes to SignPath as an artifact and comes back signed before it is zipped and put in the installer.
      # Without the secrets the builds stay unsigned as before.
      - name: Upload the .exe for signing (Windows)
        if: runner.os == 'Windows' && env.HAS_SIGNPATH == 'true' && startsWith(github.ref, 'refs/tags/v')
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: build/bin/mormicommander.exe
          if-no-files-found: error
      - name: Sign the .exe (Windows, SignPath)
        if: steps.unsigned-exe.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mormicommander
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed-exe
      - name: Use the signed .exe (Windows)
        if: steps.unsigned-exe.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item build\signed-exe\mormicommander.exe build\bin\mormicommander.exe -Force
          if ((Get-AuthenticodeSignature build\bin\mormicommander.exe).Status -ne 'Valid') { throw 'the .exe is not signed' }
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build\bin\mormicommander.exe, LICENSE -DestinationPath "dist\mormicommander-$v-windows-x64.zip"
          choco install innosetup -y --no-progress
          (Get-Content packaging\windows\installer.iss -Raw).Replace('__VERSION__', $v) | Set-Content packaging\windows\installer.generated.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q packaging\windows\installer.generated.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length
      # The installer is signed the same way, after Inno Setup made it from the signed .exe.
      - name: Upload the installer for signing (Windows)
        if: steps.unsigned-exe.outcome == 'success'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/mormicommander-setup-*.exe
          if-no-files-found: error
      - name: Sign the installer (Windows, SignPath)
        if: steps.unsigned-setup.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mormicommander
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed-setup
      - name: Use the signed installer (Windows)
        if: steps.unsigned-setup.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item build\signed-setup\mormicommander-setup-*.exe dist\ -Force
          Get-ChildItem dist\mormicommander-setup-*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid') { throw "$($_.Name) is not signed" }
          }
      # The installer is what winget runs, so test it for real: silent install, Start menu entry, the app starts and
      # stays up, silent uninstall, nothing left behind.
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\mormicommander-setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'no installer in dist' }
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $p.WaitForExit(180000)) { throw 'installer did not finish in 3 minutes' }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\mormicommander'
          $exe = Join-Path $dir 'mormicommander.exe'
          foreach ($f in 'mormicommander.exe', 'LICENSE') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f after install" }
          }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\mormiCommander.lnk'
          if (-not (Test-Path $lnk)) { throw 'no Start menu entry' }
          Write-Host 'installed: files and Start menu entry are there'
          # The app has to start and keep running (a missing WebView2 runtime, for one, makes it exit at once).
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "mormicommander exited right after starting (exit code $($app.ExitCode))" }
          Write-Host 'mormicommander is running'
          Stop-Process -Id $app.Id -Force
          $uninstaller = Get-ChildItem (Join-Path $dir 'unins*.exe') | Select-Object -First 1
          $u = Start-Process $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $u.WaitForExit(120000)) { throw 'uninstaller did not finish in 2 minutes' }
          # The uninstaller hands over to a temporary copy of itself and exits, so wait for the files to go.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $exe) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw 'files left after uninstall' }
          if (Test-Path $lnk) { throw 'Start menu entry left after uninstall' }
          Write-Host 'install, start and uninstall all work'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # The .deb installed the way a user would, on a clean Ubuntu with no GTK 4 or WebKitGTK 6.0: apt has to bring them, and
  # the app has to start.
  deb:
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive   # no questions from apt (time zone and the like)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mormicommander-linux
          path: dist
      - name: Install the .deb with apt
        run: |
          apt-get update
          if ldconfig -p | grep -E 'libwebkitgtk-6|libgtk-4'; then echo 'the system already has GTK 4 or WebKitGTK 6.0'; exit 1; fi
          apt-get install -y ./dist/mormicommander_*_amd64.deb
          apt-get install -y --no-install-recommends xvfb xauth dbus
          dbus-uuidgen --ensure   # the session bus wants a machine id, which a bare container lacks
          dpkg -L mormicommander
      # There is no GPU in the container: GTK draws with cairo and WebKit without DMA-BUF, as on a plain virtual display.
      # A desktop session always has a D-Bus session bus, and GTK 4 needs one, so dbus-run-session starts a private bus
      # for the app. The runner does not allow new user namespaces, so bubblewrap cannot build WebKitGTK 6.0's web
      # process sandbox; the sandbox is switched off here only, never in the app (real desktops allow it).
      - name: The app starts and keeps running (demo files, virtual display)
        env:
          GSK_RENDERER: cairo
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: |
          set +e
          timeout 20 dbus-run-session -- xvfb-run -a mormicommander --demo > /tmp/app.log 2>&1
          code=$?
          cat /tmp/app.log
          if [ $code -ne 124 ]; then echo "mormicommander exited with $code before the 20 s were up"; exit 1; fi
          echo 'mormicommander ran for 20 s'
      - name: Removed cleanly
        run: |
          apt-get remove -y mormicommander
          if [ -e /usr/bin/mormicommander ] || [ -e /usr/share/applications/mormicommander.desktop ]; then echo 'files left after removal'; exit 1; fi

  # Pushing a tag like v0.5.0 attaches every package to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mormicommander-{macos,linux,windows}
          merge-multiple: true
      # The checksums for the download page (docs/DOWNLOADS.md), made from the very files that are uploaded.
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
